name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Format check
        run: poetry run ruff format --check .
      - name: Lint
        run: poetry run ruff check .
      - name: Type check
        run: poetry run mypy src tests

  tests:
    name: tests-and-coverage
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run unit tests
        run: poetry run pytest --no-cov tests/unit
      - name: Run integration tests
        run: poetry run pytest --no-cov tests/integration
      - name: Run full suite with coverage gate
        run: poetry run pytest
      - name: Upload coverage xml
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  eval-regression:
    name: eval-regression-gate
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run evaluation candidate
        run: poetry run incident-agent run-eval --benchmark-path eval/benchmarks/scenarios.json --artifact-root artifacts/eval-ci
      - name: Compare candidate vs golden baseline
        run: |
          CANDIDATE_SUMMARY=$(ls -1dt artifacts/eval-ci/* | head -n1)/summary.json
          poetry run incident-agent compare-eval \
            --baseline-summary-path eval/golden/baseline_summary.json \
            --candidate-summary-path "$CANDIDATE_SUMMARY" \
            --output-dir artifacts/eval-ci/compare
      - name: Upload eval regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-regression-artifacts
          path: artifacts/eval-ci/compare
          if-no-files-found: error

  container-build:
    name: container-image-build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t ai-incident-analysis-agent:ci .
