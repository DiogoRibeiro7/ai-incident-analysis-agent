name: stale

on:
  schedule:
    - cron: "15 8 * * 1-5"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has had no activity for 30 days and was marked stale.
            Comment or update it to keep it open.
          stale-pr-message: >
            This PR has had no activity for 30 days and was marked stale.
            Push updates or comment to keep it open.
          close-issue-message: >
            Closing this issue due to inactivity.
          close-pr-message: >
            Closing this PR due to inactivity.
          exempt-issue-labels: pinned,security,priority-high
          exempt-pr-labels: pinned,security,work-in-progress
