name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please include clear reproduction steps and expected behavior.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands/inputs used.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / traces
      description: Paste relevant logs, stack traces, or artifacts.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Commit SHA, tag, or branch.
      placeholder: e.g. main@abcdef1
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ingestion
        - normalization
        - anomaly detection
        - correlation
        - rca
        - llm
        - api
        - cli
        - ci
    validations:
      required: true
