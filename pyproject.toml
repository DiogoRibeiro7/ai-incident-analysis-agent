[tool.poetry]
name = "ai-incident-analysis-agent"
version = "0.1.0"
description = "AI agent scaffold for incident analysis over logs and metrics."
authors = ["Diogo Ribeiro"]
readme = "README.md"
packages = [{ include = "incident_agent", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.135.1"
uvicorn = { extras = ["standard"], version = "^0.35.0" }
pydantic = "^2.11.7"
pydantic-settings = "^2.11.0"
typer = "^0.17.4"
rich = "^14.1.0"
pyyaml = "^6.0.2"
httpx = "^0.28.1"
starlette = ">=0.49.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.1,<10.0.0"
pytest-cov = "^6.2.1"
ruff = "^0.12.7"
mypy = "^1.17.1"
pre-commit = "^4.2.0"
types-pyyaml = "^6.0.12.20250915"

[tool.poetry.scripts]
incident-agent = "incident_agent.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=src/incident_agent --cov-report=term-missing --cov-report=xml --cov-fail-under=85 -q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/incident_agent"]

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 85
omit = ["src/incident_agent/__init__.py"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
