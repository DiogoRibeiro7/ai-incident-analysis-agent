app_name: ai-incident-analysis-agent
environment: local
llm_provider: mock
incident:
  error_level_threshold: ERROR
  metric_zscore_threshold: 2.5
normalization:
  bucket_size_minutes: 5
  log_spike_threshold: 4
  error_burst_threshold: 2
  latency_metrics:
    - request_latency_ms
    - latency_ms
    - p95_latency_ms
  cpu_metrics:
    - cpu_usage
    - cpu_percent
  memory_metrics:
    - memory_usage
    - memory_usage_mb
    - memory_used_mb
  service_failure_metrics:
    - error_rate
    - upstream_failure_rate
    - service_unavailable
anomaly_detection:
  error_rate:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.5
    mad_multiplier: 2.5
    min_relative_change: 0.15
  latency:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.5
    mad_multiplier: 2.5
    min_relative_change: 0.2
  cpu:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.5
    mad_multiplier: 2.5
    min_relative_change: 0.15
  memory:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.5
    mad_multiplier: 2.5
    min_relative_change: 0.15
  traffic:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.2
    mad_multiplier: 2.2
    min_relative_change: 0.1
  availability:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.0
    mad_multiplier: 2.0
    min_relative_change: 0.1
