app_name: ai-incident-analysis-agent
environment: local
llm_provider: mock
observability:
  log_level: INFO
  json_logs: true
llm:
  provider: mock
  report_model: gpt-4.1-mini
  completion_model: gpt-4.1-mini
  timeout_seconds: 20.0
  max_retries: 3
  retry_backoff_seconds: 1.0
incident:
  error_level_threshold: ERROR
  metric_zscore_threshold: 2.5
normalization:
  bucket_size_minutes: 5
  log_spike_threshold: 4
  error_burst_threshold: 2
  latency_metrics:
    - request_latency_ms
    - latency_ms
    - p95_latency_ms
  cpu_metrics:
    - cpu_usage
    - cpu_percent
  memory_metrics:
    - memory_usage
    - memory_usage_mb
    - memory_used_mb
  service_failure_metrics:
    - error_rate
    - upstream_failure_rate
    - service_unavailable
anomaly_detection:
  error_rate:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.5
    mad_multiplier: 2.5
    min_relative_change: 0.15
  latency:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.5
    mad_multiplier: 2.5
    min_relative_change: 0.2
  cpu:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.5
    mad_multiplier: 2.5
    min_relative_change: 0.15
  memory:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.5
    mad_multiplier: 2.5
    min_relative_change: 0.15
  traffic:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.2
    mad_multiplier: 2.2
    min_relative_change: 0.1
  availability:
    min_support: 3
    lookback_windows: 20
    z_threshold: 2.0
    mad_multiplier: 2.0
    min_relative_change: 0.1
correlation:
  max_time_distance_minutes: 10
  minimum_evidence_count: 2
  severity_weighting:
    error_rate_spike: 1.1
    latency_spike: 1.0
    cpu_anomaly: 0.9
    memory_anomaly: 0.9
    traffic_drop: 1.0
    service_unavailability: 1.2
  dependency_downstream_bonus: 1.0
  dependency_upstream_penalty: 0.5
  cross_signal_bonus: 0.3
  same_service_bonus: 0.4
  dependency_graph_path: configs/service_dependencies.yaml
rca:
  service_failure_bonus: 1.0
  downstream_bonus: 0.8
  ambiguity_delta: 0.75
  dependency_graph_path: configs/service_dependencies.yaml
evaluation:
  benchmark_path: eval/benchmarks/scenarios.json
  artifact_root: artifacts/eval
  include_real_llm: false
